services:
  - type: web
    name: carwash-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn carwash_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: carwash-db
          property: connectionString

databases:
  - name: carwash-db
    plan: free
    databaseName: shell_carwash
    user: carwash_admin

